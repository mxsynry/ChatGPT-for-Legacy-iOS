name: Build Unsigned iOS IPA

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build ARM64 Unsigned IPA
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply ARM64 patch
        run: |
          python3 apply_arm64_patch.py

      - name: Show Xcode environment
        run: |
          xcodebuild -version
          xcodebuild -project ChatGPT.xcodeproj -list

      - name: Build ARM64 device app
        run: |
          set -o pipefail

          rm -rf build Payload

          xcodebuild \
            -project ChatGPT.xcodeproj \
            -target ChatGPT \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            IPHONEOS_DEPLOYMENT_TARGET=16.0 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CONFIGURATION_BUILD_DIR="$PWD/build" \
            build | tee xcodebuild.log

      - name: Verify ARM64 app
        run: |
          set -euxo pipefail

          APP="$(find build -maxdepth 2 -type d -name 'ChatGPT.app' | head -1)"

          if [ -z "$APP" ]; then
            echo "ChatGPT.app was not produced"
            exit 1
          fi

          echo "App: $APP"

          file "$APP/ChatGPT"
          lipo -info "$APP/ChatGPT"

      - name: Package unsigned IPA
        run: |
          set -euxo pipefail

          APP="$(find build -maxdepth 2 -type d -name 'ChatGPT.app' | head -1)"

          rm -rf Payload
          mkdir Payload

          cp -R "$APP" Payload/ChatGPT.app

          ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            Payload \
            ChatGPT-Legacy-arm64-unsigned.ipa

          ls -lh ChatGPT-Legacy-arm64-unsigned.ipa

          unzip -l ChatGPT-Legacy-arm64-unsigned.ipa | head -50

      - name: Upload IPA and build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ChatGPT-Legacy-arm64-build
          path: |
            ChatGPT-Legacy-arm64-unsigned.ipa
            xcodebuild.log
          if-no-files-found: warn
          retention-days: 30

      - name: Build summary
        if: always()
        run: |
          echo "## ChatGPT Legacy ARM64 Build" >> "$GITHUB_STEP_SUMMARY"

          if [ -f ChatGPT-Legacy-arm64-unsigned.ipa ]; then
            echo "✅ Unsigned IPA produced." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Sign the IPA with Ksign before installation." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ IPA was not produced. Check xcodebuild.log." >> "$GITHUB_STEP_SUMMARY"
          fi
