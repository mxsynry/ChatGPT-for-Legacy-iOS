name: Build unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ "master" ]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode environment
        run: |
          xcodebuild -version
          xcodebuild -project ChatGPT.xcodeproj -list

      - name: Build unsigned arm64 device app
        run: |
          set -o pipefail
          rm -rf build Payload

          xcodebuild \
            -project ChatGPT.xcodeproj \
            -target ChatGPT \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            IPHONEOS_DEPLOYMENT_TARGET=16.0 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CONFIGURATION_BUILD_DIR="$PWD/build" \
            build | tee xcodebuild.log

      - name: Verify and package IPA
        run: |
          set -euxo pipefail

          APP="$(find build -maxdepth 2 -type d -name 'ChatGPT.app' | head -1)"
          test -n "$APP"
          test -f "$APP/ChatGPT"

          file "$APP/ChatGPT"
          lipo -info "$APP/ChatGPT" || true

          mkdir Payload
          cp -R "$APP" Payload/

          ditto -c -k --sequesterRsrc --keepParent \
            Payload ChatGPT-Legacy-arm64-unsigned.ipa

      - name: Upload IPA and build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ChatGPT-Legacy-arm64-build
          path: |
            ChatGPT-Legacy-arm64-unsigned.ipa
            xcodebuild.log
          if-no-files-found: warn
